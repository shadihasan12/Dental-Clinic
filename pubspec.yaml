name: dental_clinic_app
description: "A dental clinic management Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.0

  # Networking
  dio: ^5.4.0
  internet_connection_checker: ^1.0.0+1

  # Functional Programming
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1

  # Navigation
  go_router: ^14.2.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Local Storage
  shared_preferences: ^2.2.2

  flutter_gen: ^5.12.0
  flutter_gen_runner: ^5.12.0
  carousel_slider: ^5.1.1
  flutter_svg: ^2.2.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.7
  injectable_generator: ^2.6.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  generate: true  # Enable localization generation

  assets:
    - assets/icons/
    - assets/icons/root/
    - assets/icons/case/teeth/
    - assets/images/onboarding/
    - .env

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/geist/Geist-ExtraBold.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700


flutter_gen:
  output: lib/core/resources/gen/ # Output folder
  line_length: 80

  assets:
    enabled: true
    exclude:
      - .env
    outputs:
      style: camel-case
      package_parameter_enabled: false
      class_name: Assets

  fonts:
    enabled: true
    outputs:
      class_name: FontFamily