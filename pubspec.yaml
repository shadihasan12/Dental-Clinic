name: dental_clinic_app
description: "A dental clinic management Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.0

  # Networking
  dio: ^5.4.0
  internet_connection_checker: ^1.0.0+1

  # Functional Programming
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1

  # Navigation
  go_router: ^14.2.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Google Fonts (for Inter font)
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.7
  injectable_generator: ^2.6.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - .env

